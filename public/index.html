<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📱 Temp SMS — Free Temporary Phone Numbers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config={theme:{extend:{fontFamily:{inter:['Inter','sans-serif']}}}}
  </script>
  <style>
    *{box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#06060e;color:#e8edf5}
    .glass{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
    .glass-hover:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14)}
    .btn-primary{background:linear-gradient(135deg,#6366f1,#a855f7);box-shadow:0 8px 24px rgba(139,92,246,.25)}
    .btn-primary:hover{filter:brightness(1.1)}
    .btn-success{background:linear-gradient(135deg,#10b981,#0d9488);box-shadow:0 8px 24px rgba(16,185,129,.2)}
    .btn-success:hover{filter:brightness(1.1)}
    .input-dark{background:#06060e;border:1px solid rgba(255,255,255,.1);color:#fff;transition:all .2s}
    .input-dark:focus{outline:none;border-color:#a855f7;box-shadow:0 0 0 4px rgba(168,85,247,.12)}
    .dot-live{box-shadow:0 0 8px #22c55e;animation:pulseSoft 2s infinite}
    @keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .anim-fade{animation:fadeIn .4s ease both}
    #toast{position:fixed;bottom:22px;right:22px;z-index:9999;padding:14px 20px;border-radius:12px;font-weight:600;font-size:.9rem;color:#fff;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(14px);pointer-events:none;transition:opacity .3s,transform .3s;font-family:'Inter',sans-serif}
    #toast.show{opacity:1;transform:translateY(0)}
    #toast.ok{background:linear-gradient(135deg,#6366f1,#a855f7)}
    #toast.err{background:linear-gradient(135deg,#dc2626,#ef4444)}
  </style>
</head>
<body class="min-h-screen" style="background-image:radial-gradient(900px 400px at 50% -80px,rgba(139,92,246,.1),transparent 60%),radial-gradient(600px 300px at 90% 90%,rgba(99,102,241,.07),transparent 55%)">
  <div class="max-w-[860px] mx-auto px-5 py-8 pb-16">
    <div class="text-center mb-8 anim-fade">
      <span class="inline-flex items-center gap-2 text-[11px] font-bold tracking-widest uppercase text-purple-100 bg-purple-500/12 border border-purple-500/25 rounded-full px-4 py-1.5 mb-4">
        <span class="w-2 h-2 rounded-full bg-green-500 dot-live"></span>
        Local Service
      </span>
      <h1 class="text-4xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 via-purple-300 to-indigo-300 mb-2">Temp SMS</h1>
      <p class="text-[#ffffff8c] text-sm max-w-[520px] mx-auto">Pilih nomor sementara, pantau pesan masuk, dan ambil OTP/verifikasi.</p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
      <!-- Numbers -->
      <section class="glass rounded-2xl p-6 anim-fade">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-500 shadow-[0_6px_18px_rgba(139,92,246,.35)]">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
          </div>
          <div>
            <h2 class="text-white font-bold">Nomor Tersedia</h2>
            <p class="text-[#ffffff80] text-xs">Klik nomor untuk melihat inbox</p>
          </div>
        </div>
        <div class="flex gap-3 mb-3">
          <select id="countrySelect" class="flex-1 input-dark rounded-xl px-3 py-2.5 text-sm">
            <option value="">Semua negara</option>
          </select>
          <input id="searchInput" type="text" placeholder="Cari nomor..." class="flex-1 input-dark rounded-xl px-3 py-2.5 text-sm">
        </div>
        <div id="numberList" class="space-y-2 max-h-[460px] overflow-y-auto pr-1"></div>
      </section>

      <!-- Inbox -->
      <section class="glass rounded-2xl p-6 anim-fade" style="animation-delay:.1s">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-xl flex items-center justify-center bg-gradient-to-br from-[#10b981] to-[#0d9488] shadow-[0_6px_18px_rgba(16,185,129,.3)]">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
          </div>
          <div class="flex-1">
            <h2 class="text-white font-bold">Inbox</h2>
            <div class="text-[#ffffff80] text-xs"><span id="inboxNumber">Pilih nomor</span> · <span id="inboxCount">—</span></div>
          </div>
          <button id="refreshInbox" class="btn-success border-0 rounded-xl px-3 py-2 text-xs font-bold cursor-pointer text-white flex items-center gap-2 transition-all" type="button">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            Refresh
          </button>
        </div>
        <div class="rounded-xl bg-black/25 border border-white/5 p-4 min-h-[200px]" id="inboxList">
          <div class="text-center py-10 text-[#ffffff60]">Pilih nomor untuk melihat pesan.</div>
        </div>
      </section>
    </div>
  </div>

  <div id="toast"></div>
  <script>
  (function(){
    const $=id=>document.getElementById(id);
    const numberList=$('numberList');
    const inboxList=$('inboxList');
    const inboxNumber=$('inboxNumber');
    const inboxCount=$('inboxCount');
    const countrySelect=$('countrySelect');
    const searchInput=$('searchInput');
    const refreshInbox=$('refreshInbox');
    const toast=$('toast');
    let allNumbers=[];
    let currentId=null;

    function showToast(text,type='ok'){
      toast.textContent=text; toast.className='show '+(type||'ok');
      clearTimeout(toast._timer);
      toast._timer=setTimeout(()=>toast.className='',2200);
    }

    function showError(msg){
      inboxList.innerHTML=`<div class="text-center py-10 text-red-300">${msg}</div>`;
    }

    async function loadNumbers(){
      try{
        const country=countrySelect.value;
        const url=country?`/api/numbers?country=${encodeURIComponent(country)}`:'/api/numbers';
        const res=await fetch(url);
        const data=await res.json();
        if(!data.success) return showError('Gagal memuat nomor.');
        allNumbers=data.numbers;
        renderNumbers(allNumbers);
      }catch(e){ showError('Error memuat nomor.'); }
    }

    function renderNumbers(items){
      numberList.innerHTML='';
      if(!items.length){ numberList.innerHTML='<div class="text-sm text-[#ffffff60] text-center py-6">Tidak ada nomor.</div>'; return; }
      items.forEach(n=>{
        const el=document.createElement('button');
        el.className='w-full text-left glass-hover glass rounded-xl px-4 py-3 transition-all cursor-pointer flex items-center justify-between gap-3';
        el.innerHTML=`<div class="min-w-0">
          <div class="text-white font-semibold text-sm truncate">+${escapeHtml(n.id)}</div>
          <div class="text-[#ffffff70] text-xs">${escapeHtml(n.country)} · ${escapeHtml(n.added)}</div>
        </div>
        <button type="button" class="copy-btn shrink-0 glass rounded-lg px-3 py-1.5 text-[10px] font-bold text-white flex items-center gap-1.5 transition-all" data-id="${escapeHtml(n.id)}">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          <span>Copy</span>
        </button>`;
        el.onclick=(ev)=>{
          const copyBtn=ev.target.closest('.copy-btn');
          if(copyBtn){
            ev.stopPropagation();
            copyNumber(n.id, copyBtn);
            return;
          }
          openNumber(n);
        };
        numberList.appendChild(el);
      });
    }

    function copyNumber(id, btn){
      const number='+'+id;
      navigator.clipboard.writeText(number).then(()=>{
        const span=btn.querySelector('span');
        const original=span.textContent;
        span.textContent='Copied';
        btn.classList.add('!border-emerald-500/40','!bg-emerald-500/15');
        btn.classList.remove('!border-emerald-500/40','!bg-emerald-500/15');
        showToast('📋 '+number+' disalin!');
        setTimeout(()=>{ span.textContent=original; }, 1500);
      }).catch(()=>{
        showToast('Gagal menyalin','err');
      });
    }

    async function openNumber(n){
      currentId=n.id;
      inboxNumber.textContent='+'+n.id;
      inboxList.innerHTML='<div class="text-center py-6 text-[#ffffff60]">Memuat pesan...</div>';
      try{
        const res=await fetch(`/api/messages/${encodeURIComponent(n.id)}`);
        const data=await res.json();
        if(!data.success) return showError('Gagal memuat pesan.');
        inboxCount.textContent=data.total_messages+' pesan';
        renderMessages(data.messages);
      }catch(e){ showError('Error memuat pesan.'); }
    }

    function renderMessages(messages){
      if(!messages.length){ inboxList.innerHTML='<div class="text-center py-10 text-[#ffffff60]">Belum ada pesan.</div>'; return; }
      let html='';
      messages.forEach((m,i)=>{
        html+=`<div class="anim-fade bg-white/5 border border-white/10 rounded-xl p-4 mb-2 hover:border-purple-500/30 transition-all" style="animation-delay:${i*40}ms">
          <div class="flex items-center justify-between mb-1">
            <span class="text-white font-semibold text-sm">${escapeHtml(m.from||'unknown')}</span>
            <span class="text-[#ffffff70] text-[10px]">${escapeHtml(m.received||'')}</span>
          </div>
          <div class="text-purple-100 text-sm whitespace-pre-wrap break-all">${escapeHtml(m.body)}</div>
        </div>`;
      });
      inboxList.innerHTML=html;
    }

    function escapeHtml(text){
      if(!text) return '';
      const div=document.createElement('div');
      div.textContent=text;
      return div.innerHTML;
    }

    refreshInbox?.addEventListener('click',()=>{
      if(!currentId) return showToast('Pilih nomor dulu','err');
      openNumber({id:currentId,country:'',added:''});
      showToast('🔄 Inbox diperbarui');
    });

    countrySelect?.addEventListener('change', loadNumbers);
    searchInput?.addEventListener('input', e=>{
      const q=e.target.value.trim().toLowerCase();
      const filtered=allNumbers.filter(n => n.id.includes(q) || n.country.toLowerCase().includes(q));
      renderNumbers(filtered);
    });

    async function init(){
      try{
        const res=await fetch('/api/countries');
        const data=await res.json();
        if(data.success){
          data.countries.forEach(c=>{
            const o=document.createElement('option');
            o.value=c.slug; o.textContent=`${c.name} (+${c.count})`;
            countrySelect.appendChild(o);
          });
        }
      }catch(e){}
      await loadNumbers();
    }
    init();
  })();
  </script>
</body>
</html>
